<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1200" height="440" rx="24" fill="#fffbeb"/>
  <text x="600" y="52" text-anchor="middle" font-size="30" font-weight="700" fill="#0f172a">How the duck feeder works</text>
  <text x="600" y="84" text-anchor="middle" font-size="17" fill="#475569">A viewer sends a big gift on your TikTok LIVE, and a portion of food drops into the duck's dish, on camera.</text>

  <!-- arrows -->
  <g stroke="#475569" stroke-width="3" fill="none" marker-end="url(#ar)">
    <line x1="178" y1="220" x2="212" y2="220"/>
    <line x1="378" y1="220" x2="412" y2="220"/>
    <line x1="578" y1="220" x2="612" y2="220" stroke-dasharray="6 5"/>
    <line x1="778" y1="220" x2="812" y2="220"/>
    <line x1="978" y1="220" x2="1012" y2="220"/>
  </g>
  <text x="596" y="244" text-anchor="middle" font-size="12" fill="#475569">Wi-Fi</text>

  <!-- 1 viewer phone -->
  <g transform="translate(30,120)">
    <rect width="148" height="250" rx="18" fill="#fce7f3" stroke="#db2777" stroke-width="2.5"/>
    <circle cx="26" cy="26" r="15" fill="#db2777"/><text x="26" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">1</text>
    <rect x="49" y="40" width="50" height="86" rx="8" fill="#fff" stroke="#9d174d" stroke-width="2.5"/>
    <rect x="63" y="74" width="22" height="18" rx="2" fill="#f472b6"/>
    <rect x="61" y="69" width="26" height="6" rx="2" fill="#db2777"/>
    <line x1="74" y1="69" x2="74" y2="92" stroke="#fff" stroke-width="2.5"/>
    <text x="74" y="160" text-anchor="middle" font-size="17" font-weight="700" fill="#831843">Viewer</text>
    <text x="74" y="184" text-anchor="middle" font-size="14" fill="#831843">sends a gift</text>
    <text x="74" y="203" text-anchor="middle" font-size="14" fill="#831843">worth 250+ coins</text>
    <text x="74" y="222" text-anchor="middle" font-size="14" fill="#831843">or subscribes</text>
  </g>

  <!-- 2 tiktok live -->
  <g transform="translate(214,120)">
    <rect width="164" height="250" rx="18" fill="#e2e8f0" stroke="#334155" stroke-width="2.5"/>
    <circle cx="26" cy="26" r="15" fill="#334155"/><text x="26" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">2</text>
    <rect x="44" y="52" width="76" height="40" rx="10" fill="#ef4444"/>
    <text x="82" y="79" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">LIVE</text>
    <path d="M60 104 h44 M60 116 h30" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
    <text x="82" y="160" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b">TikTok LIVE</text>
    <text x="82" y="184" text-anchor="middle" font-size="14" fill="#1e293b">announces the gift</text>
    <text x="82" y="203" text-anchor="middle" font-size="14" fill="#1e293b">instantly</text>
  </g>

  <!-- 3 windows pc -->
  <g transform="translate(414,120)">
    <rect width="164" height="250" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
    <circle cx="26" cy="26" r="15" fill="#2563eb"/><text x="26" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">3</text>
    <rect x="37" y="46" width="90" height="62" rx="6" fill="#1e3a8a"/>
    <rect x="44" y="53" width="76" height="48" rx="3" fill="#93c5fd"/>
    <text x="82" y="82" text-anchor="middle" font-size="11" font-weight="700" fill="#1e3a8a">TikFinity</text>
    <rect x="72" y="108" width="20" height="10" fill="#1e3a8a"/><rect x="58" y="118" width="48" height="6" rx="3" fill="#1e3a8a"/>
    <text x="82" y="160" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">Your PC</text>
    <text x="82" y="184" text-anchor="middle" font-size="14" fill="#1e3a8a">The free TikFinity</text>
    <text x="82" y="203" text-anchor="middle" font-size="14" fill="#1e3a8a">app sees the gift</text>
    <text x="82" y="222" text-anchor="middle" font-size="14" fill="#1e3a8a">and pings the Pi</text>
  </g>

  <!-- 4 raspberry pi -->
  <g transform="translate(614,120)">
    <rect width="164" height="250" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
    <circle cx="26" cy="26" r="15" fill="#16a34a"/><text x="26" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">4</text>
    <rect x="34" y="52" width="96" height="64" rx="6" fill="#15803d"/>
    <g fill="#facc15"><rect x="42" y="56" width="80" height="7" rx="1"/></g>
    <rect x="70" y="76" width="26" height="26" rx="2" fill="#0f172a"/>
    <rect x="108" y="80" width="18" height="22" rx="2" fill="#cbd5e1"/>
    <text x="82" y="160" text-anchor="middle" font-size="17" font-weight="700" fill="#14532d">Raspberry Pi</text>
    <text x="82" y="184" text-anchor="middle" font-size="14" fill="#14532d">checks the safety</text>
    <text x="82" y="203" text-anchor="middle" font-size="14" fill="#14532d">limits, then tells</text>
    <text x="82" y="222" text-anchor="middle" font-size="14" fill="#14532d">the motor to move</text>
  </g>

  <!-- 5 servo + hopper -->
  <g transform="translate(814,120)">
    <rect width="164" height="250" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
    <circle cx="26" cy="26" r="15" fill="#7c3aed"/><text x="26" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">5</text>
    <path d="M58 42 h48 l-14 40 h-20 z" fill="#fde68a" stroke="#92400e" stroke-width="2"/>
    <rect x="70" y="84" width="34" height="6" rx="2" fill="#7c3aed" transform="rotate(35 72 87)"/>
    <rect x="106" y="80" width="22" height="16" rx="2" fill="#1e293b"/>
    <circle cx="80" cy="104" r="3.5" fill="#92400e"/><circle cx="88" cy="114" r="3.5" fill="#92400e"/><circle cx="78" cy="120" r="3.5" fill="#92400e"/>
    <text x="82" y="160" text-anchor="middle" font-size="17" font-weight="700" fill="#4c1d95">Feeder</text>
    <text x="82" y="184" text-anchor="middle" font-size="14" fill="#4c1d95">a small motor flips</text>
    <text x="82" y="203" text-anchor="middle" font-size="14" fill="#4c1d95">a flap open, then</text>
    <text x="82" y="222" text-anchor="middle" font-size="14" fill="#4c1d95">shut again</text>
  </g>

  <!-- 6 duck -->
  <g transform="translate(1014,120)">
    <rect width="156" height="250" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
    <circle cx="26" cy="26" r="15" fill="#d97706"/><text x="26" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">6</text>
    <ellipse cx="74" cy="100" rx="38" ry="22" fill="#facc15"/>
    <circle cx="104" cy="70" r="17" fill="#facc15"/>
    <circle cx="109" cy="66" r="3" fill="#0f172a"/>
    <path d="M119 70 l16 3 l-16 5 z" fill="#f97316"/>
    <path d="M50 96 q14 -12 30 0" stroke="#eab308" stroke-width="4" fill="none"/>
    <path d="M40 124 h70 l-8 10 h-54 z" fill="#94a3b8"/>
    <text x="78" y="160" text-anchor="middle" font-size="17" font-weight="700" fill="#78350f">Duck eats!</text>
    <text x="78" y="184" text-anchor="middle" font-size="14" fill="#78350f">food lands in the</text>
    <text x="78" y="203" text-anchor="middle" font-size="14" fill="#78350f">dish, live on</text>
    <text x="78" y="222" text-anchor="middle" font-size="14" fill="#78350f">your stream</text>
  </g>

  <text x="600" y="412" text-anchor="middle" font-size="15" fill="#475569">Built-in safety: at most one portion every 20 seconds and 30 per day (you can change both), so a gift spree can't overfeed the duck.</text>
</svg>
