<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <g id="rig">
      <!-- backboard -->
      <rect x="20" y="0" width="300" height="470" rx="6" fill="#e7c08f" stroke="#92400e" stroke-width="2"/>
      <path d="M40 60 h120 M180 140 h110 M50 300 h90 M200 380 h90" stroke="#c9975a" stroke-width="2"/>
      <!-- bottle, upside down -->
      <path d="M110 30 h100 v120 q0 30 -28 46 v34 h-44 v-34 q-28 -16 -28 -46 z" fill="#e0f2fe" fill-opacity="0.85" stroke="#0369a1" stroke-width="3"/>
      <path d="M110 30 h100" stroke="#0369a1" stroke-width="3" stroke-dasharray="7 5"/>
      <g fill="#92400e"><circle cx="128" cy="100" r="5"/><circle cx="146" cy="90" r="5"/><circle cx="164" cy="104" r="5"/><circle cx="182" cy="92" r="5"/><circle cx="196" cy="108" r="5"/><circle cx="136" cy="120" r="5"/><circle cx="156" cy="128" r="5"/><circle cx="176" cy="122" r="5"/><circle cx="192" cy="134" r="5"/><circle cx="146" cy="146" r="5"/><circle cx="166" cy="152" r="5"/><circle cx="160" cy="174" r="5"/><circle cx="156" cy="196" r="5"/><circle cx="164" cy="218" r="5"/></g>
      <!-- zip ties -->
      <rect x="104" y="60" width="112" height="9" rx="3" fill="#0f172a"/>
      <rect x="104" y="128" width="112" height="9" rx="3" fill="#0f172a"/>
      <!-- servo, glued flat to board, shaft pointing at you -->
      <rect x="222" y="226" width="78" height="44" rx="5" fill="#1e293b"/>
      <rect x="214" y="240" width="94" height="10" rx="3" fill="#1e293b"/>
      <circle cx="240" cy="248" r="10" fill="#e2e8f0" stroke="#0f172a" stroke-width="2"/>
      <!-- chute + dish -->
      <path d="M128 330 h64 l-8 100 h-48 z" fill="#cbd5e1" fill-opacity="0.7" stroke="#64748b" stroke-width="2"/>
      <path d="M90 470 h140 l-14 26 h-112 z" fill="#94a3b8" stroke="#475569" stroke-width="2"/>
    </g>
  </defs>

  <rect width="1200" height="680" rx="24" fill="#f8fafc"/>
  <text x="600" y="48" text-anchor="middle" font-size="30" font-weight="700" fill="#0f172a">Building the feeder (the easy bottle version)</text>
  <text x="600" y="78" text-anchor="middle" font-size="16" fill="#475569">Front view. A flap glued to the servo arm sits under the bottle mouth. The servo swings it away, food falls, it swings back.</text>

  <!-- CLOSED -->
  <g transform="translate(150,120)">
    <use href="#rig"/>
    <!-- flap closed: horizontal under the mouth, from servo shaft -->
    <rect x="128" y="240" width="122" height="14" rx="5" fill="#fde68a" stroke="#a16207" stroke-width="2"/>
    <circle cx="240" cy="248" r="5" fill="#0f172a"/>
    <rect x="80" y="-10" width="180" height="0" fill="none"/>
  </g>
  <rect x="225" y="104" width="190" height="34" rx="17" fill="#0f172a"/>
  <text x="320" y="127" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">CLOSED (resting)</text>

  <!-- OPEN -->
  <g transform="translate(480,120)">
    <use href="#rig"/>
    <!-- flap swung down 90 deg around the servo shaft -->
    <rect x="233" y="240" width="14" height="122" rx="5" fill="#fde68a" stroke="#a16207" stroke-width="2"/>
    <circle cx="240" cy="248" r="5" fill="#0f172a"/>
    <path d="M196 236 a52 52 0 0 1 44 64" stroke="#7c3aed" stroke-width="3" fill="none" stroke-dasharray="6 4"/>
    <path d="M236 298 l4 10 l8 -8" stroke="#7c3aed" stroke-width="3" fill="none"/>
    <!-- falling food -->
    <g fill="#92400e"><circle cx="158" cy="250" r="5"/><circle cx="164" cy="272" r="5"/><circle cx="154" cy="296" r="5"/><circle cx="162" cy="320" r="5"/><circle cx="158" cy="350" r="5"/><circle cx="152" cy="384" r="5"/><circle cx="162" cy="410" r="5"/><circle cx="140" cy="466" r="5"/><circle cx="156" cy="462" r="5"/><circle cx="172" cy="466" r="5"/></g>
  </g>
  <rect x="555" y="104" width="190" height="34" rx="17" fill="#7c3aed"/>
  <text x="650" y="127" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">OPEN (feeding)</text>

  <!-- labels for the closed rig -->
  <g font-size="13" fill="#334155">
    <text x="12" y="170">2-litre bottle,</text><text x="12" y="186">bottom cut off,</text><text x="12" y="202">cap removed</text>
    <text x="12" y="262">zip ties</text>
    <text x="12" y="474">chute (optional):</text><text x="12" y="490">cut-off bottle top</text><text x="12" y="506">or a piece of pipe</text>
    <text x="12" y="610">duck's dish</text>
    <text x="12" y="362">flap glued to</text><text x="12" y="378">the servo arm</text>
  </g>
  <path d="M100 196 L 258 222" stroke="#334155" stroke-width="1.5"/>
  <path d="M66 258 L 252 250" stroke="#334155" stroke-width="1.5"/>
  <path d="M128 490 L 280 500" stroke="#334155" stroke-width="1.5"/>
  <path d="M86 606 L 250 600" stroke="#334155" stroke-width="1.5"/>
  <path d="M104 368 L 276 368" stroke="#334155" stroke-width="1.5"/>

  <!-- step list -->
  <g transform="translate(818,110)">
    <rect width="362" height="540" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="24" y="40" font-size="20" font-weight="700" fill="#0f172a">How to put it together</text>
    <g font-size="14.5" fill="#334155">
      <circle cx="34" cy="76" r="13" fill="#0f172a"/><text x="34" y="81" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1</text>
      <text x="58" y="72">Cut the bottom off a clean, dry</text><text x="58" y="90">2-litre bottle. Take the cap off.</text>
      <circle cx="34" cy="128" r="13" fill="#0f172a"/><text x="34" y="133" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2</text>
      <text x="58" y="124">Zip-tie it upside down to a board,</text><text x="58" y="142">neck pointing down.</text>
      <circle cx="34" cy="180" r="13" fill="#0f172a"/><text x="34" y="185" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">3</text>
      <text x="58" y="176">Hot-glue the servo flat to the board,</text><text x="58" y="194">beside the neck, its round shaft</text><text x="58" y="212">pointing at you, a little below</text><text x="58" y="230">the bottle mouth.</text>
      <circle cx="34" cy="268" r="13" fill="#0f172a"/><text x="34" y="273" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">4</text>
      <text x="58" y="264">Glue a craft stick (or a strip cut</text><text x="58" y="282">from a plastic lid) to the long</text><text x="58" y="300">servo arm. That's your flap.</text>
      <circle cx="34" cy="338" r="13" fill="#0f172a"/><text x="34" y="343" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">5</text>
      <text x="58" y="334">Push the arm onto the servo only</text><text x="58" y="352">after the Pi has moved it to its</text><text x="58" y="370">closed position (README, Part 5),</text><text x="58" y="388">so the flap lines up.</text>
      <circle cx="34" cy="426" r="13" fill="#0f172a"/><text x="34" y="431" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">6</text>
      <text x="58" y="422">Mount the board where food will</text><text x="58" y="440">fall into the dish, out of the</text><text x="58" y="458">duck's reach and away from water.</text>
    </g>
    <text x="24" y="500" font-size="14" font-weight="700" fill="#15803d">Gap between flap and mouth: 2–3 mm.</text>
    <text x="24" y="520" font-size="14" fill="#15803d">Close enough to stop pellets, not touching.</text>
  </g>
</svg>
