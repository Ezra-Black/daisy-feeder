<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="500" rx="24" fill="#fdf2f8"/>
  <text x="500" y="46" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">Raspberry Pi Imager: fill it in like this</text>
  <text x="500" y="74" text-anchor="middle" font-size="15" fill="#475569">The Imager walks you through these screens. The labels may be worded slightly differently in your version.</text>
  <g font-size="16">
    <g transform="translate(60,100)">
      <rect width="880" height="370" rx="16" fill="#fff" stroke="#f9a8d4" stroke-width="2"/>
      <g fill="#0f172a">
        <text x="30" y="46" font-weight="700">Device</text><text x="300" y="46">your Pi model (e.g. Raspberry Pi 4)</text>
        <text x="30" y="86" font-weight="700">Operating system</text><text x="300" y="86">Raspberry Pi OS (other) → <tspan font-weight="700">Raspberry Pi OS Lite (64-bit)</tspan></text>
        <text x="30" y="126" font-weight="700">Storage</text><text x="300" y="126">the microSD card (everything on it gets erased)</text>
        <line x1="30" y1="146" x2="850" y2="146" stroke="#fbcfe8" stroke-width="2"/>
        <text x="30" y="180" font-weight="700">Hostname</text><text x="300" y="180" font-family="Menlo, Consolas, monospace" font-weight="700" fill="#be185d">duckfeeder</text>
        <text x="30" y="216" font-weight="700">Username</text><text x="300" y="216">pick one, e.g. <tspan font-family="Menlo, Consolas, monospace" font-weight="700" fill="#be185d">duckowner</tspan>   (write it down)</text>
        <text x="30" y="252" font-weight="700">Password</text><text x="300" y="252">pick one   (write it down)</text>
        <text x="30" y="288" font-weight="700">Wi-Fi</text><text x="300" y="288">your home Wi-Fi name + password, the same Wi-Fi as your PC</text>
        <text x="30" y="324" font-weight="700">SSH / remote access</text><text x="300" y="324"><tspan font-weight="700" fill="#be185d">ON</tspan>, "use password authentication"</text>
      </g>
      <rect x="24" y="158" width="832" height="186" rx="10" fill="none" stroke="#ec4899" stroke-width="2" stroke-dasharray="6 5"/>
      <text x="846" y="360" text-anchor="end" font-size="13" fill="#be185d">customisation: the important part</text>
    </g>
  </g>
</svg>
