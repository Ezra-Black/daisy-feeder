<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="Helvetica, Arial, sans-serif">
  <rect width="1200" height="560" rx="24" fill="#f8fafc"/>
  <text x="600" y="48" text-anchor="middle" font-size="30" font-weight="700" fill="#0f172a">Finding the two pins you need</text>
  <text x="600" y="78" text-anchor="middle" font-size="16" fill="#475569">Hold the Pi so the 40 gold pins run along the TOP and the USB ports are on the RIGHT. This is the same on a Pi 3, 4 and 5.</text>

  <!-- board -->
  <rect x="80" y="150" width="1040" height="330" rx="22" fill="#15803d"/>
  <text x="700" y="140" text-anchor="middle" font-size="14" fill="#475569">↓ edge of the board</text>
  <!-- usb ports -->
  <rect x="1060" y="230" width="90" height="70" rx="6" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
  <rect x="1060" y="320" width="90" height="70" rx="6" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
  <text x="1048" y="270" text-anchor="end" font-size="14" font-weight="700" fill="#fff">USB ports →</text>
  <rect x="500" y="300" width="110" height="110" rx="6" fill="#0f172a"/>
  <text x="555" y="360" text-anchor="middle" font-size="13" fill="#94a3b8">chip</text>

  <!-- header -->
  <rect x="122" y="164" width="790" height="88" rx="6" fill="#111827"/>
  <g id="pins" fill="#facc15">
    <!-- outer row (even pins) y=186, inner row (odd pins) y=228, columns every 39px from x=144 -->
  </g>
  <g fill="#facc15">
    <rect x="135" y="177" width="18" height="18" rx="2"/><rect x="174" y="177" width="18" height="18" rx="2"/><rect x="213" y="177" width="18" height="18" rx="2"/><rect x="252" y="177" width="18" height="18" rx="2"/><rect x="291" y="177" width="18" height="18" rx="2"/><rect x="330" y="177" width="18" height="18" rx="2"/><rect x="369" y="177" width="18" height="18" rx="2"/><rect x="408" y="177" width="18" height="18" rx="2"/><rect x="447" y="177" width="18" height="18" rx="2"/><rect x="486" y="177" width="18" height="18" rx="2"/><rect x="525" y="177" width="18" height="18" rx="2"/><rect x="564" y="177" width="18" height="18" rx="2"/><rect x="603" y="177" width="18" height="18" rx="2"/><rect x="642" y="177" width="18" height="18" rx="2"/><rect x="681" y="177" width="18" height="18" rx="2"/><rect x="720" y="177" width="18" height="18" rx="2"/><rect x="759" y="177" width="18" height="18" rx="2"/><rect x="798" y="177" width="18" height="18" rx="2"/><rect x="837" y="177" width="18" height="18" rx="2"/><rect x="876" y="177" width="18" height="18" rx="2"/>
    <rect x="135" y="219" width="18" height="18" rx="2"/><rect x="174" y="219" width="18" height="18" rx="2"/><rect x="213" y="219" width="18" height="18" rx="2"/><rect x="252" y="219" width="18" height="18" rx="2"/><rect x="291" y="219" width="18" height="18" rx="2"/><rect x="330" y="219" width="18" height="18" rx="2"/><rect x="369" y="219" width="18" height="18" rx="2"/><rect x="408" y="219" width="18" height="18" rx="2"/><rect x="447" y="219" width="18" height="18" rx="2"/><rect x="486" y="219" width="18" height="18" rx="2"/><rect x="525" y="219" width="18" height="18" rx="2"/><rect x="564" y="219" width="18" height="18" rx="2"/><rect x="603" y="219" width="18" height="18" rx="2"/><rect x="642" y="219" width="18" height="18" rx="2"/><rect x="681" y="219" width="18" height="18" rx="2"/><rect x="720" y="219" width="18" height="18" rx="2"/><rect x="759" y="219" width="18" height="18" rx="2"/><rect x="798" y="219" width="18" height="18" rx="2"/><rect x="837" y="219" width="18" height="18" rx="2"/><rect x="876" y="219" width="18" height="18" rx="2"/>
  </g>

  <!-- pin 1 marker -->
  <rect x="131" y="215" width="26" height="26" rx="3" fill="none" stroke="#fff" stroke-width="2.5"/>
  <text x="144" y="270" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">pin 1</text>
  <text x="144" y="286" text-anchor="middle" font-size="12" fill="#dcfce7">(start here)</text>

  <!-- pins 2 and 4: 5V, don't use -->
  <g stroke="#ef4444" stroke-width="4" stroke-linecap="round">
    <path d="M136 178 l16 16 M152 178 l-16 16"/>
    <path d="M175 178 l16 16 M191 178 l-16 16"/>
  </g>

  <!-- pin 6 GND -->
  <circle cx="222" cy="186" r="17" fill="none" stroke="#fff" stroke-width="5"/>
  <!-- pin 12 signal -->
  <circle cx="339" cy="186" r="17" fill="none" stroke="#f59e0b" stroke-width="5"/>

  <!-- callouts -->
  <path d="M222 166 V 128" stroke="#0f172a" stroke-width="2.5"/>
  <rect x="150" y="98" width="144" height="30" rx="15" fill="#0f172a"/>
  <text x="222" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">GND · pin 6</text>
  <path d="M339 166 V 128" stroke="#d97706" stroke-width="2.5"/>
  <rect x="310" y="98" width="178" height="30" rx="15" fill="#f59e0b"/>
  <text x="399" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">SIGNAL · pin 12</text>
  <g transform="translate(110,330)">
    <rect width="300" height="64" rx="12" fill="#fff" opacity="0.95"/>
    <path d="M18 18 l16 16 M34 18 l-16 16" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
    <text x="48" y="30" font-size="15" font-weight="700" fill="#b91c1c">Pins 2 and 4 are 5 V power.</text>
    <text x="48" y="50" font-size="14" fill="#b91c1c">Never connect the motor to them.</text>
  </g>

  <g transform="translate(640,318)">
    <rect width="330" height="150" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="30" cy="40" r="13" fill="#0f172a"/>
    <text x="56" y="36" font-size="17" font-weight="700" fill="#0f172a">Pin 6 = Ground (GND)</text>
    <text x="56" y="56" font-size="14" fill="#475569">top row, 3rd pin from the left</text>
    <circle cx="30" cy="104" r="13" fill="#f59e0b"/>
    <text x="56" y="100" font-size="17" font-weight="700" fill="#0f172a">Pin 12 = Signal (GPIO18)</text>
    <text x="56" y="120" font-size="14" fill="#475569">top row, 6th pin from the left</text>
  </g>

  <text x="600" y="520" text-anchor="middle" font-size="16" fill="#334155">Count along the <tspan font-weight="700">top row only</tspan> (the row nearest the edge): 1st, 2nd, <tspan font-weight="700">3rd = pin 6</tspan>, 4th, 5th, <tspan font-weight="700">6th = pin 12</tspan>.</text>
</svg>
