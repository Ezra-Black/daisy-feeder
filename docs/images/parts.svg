<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="Helvetica, Arial, sans-serif">
  <rect width="1200" height="700" rx="24" fill="#f8fafc"/>
  <text x="600" y="50" text-anchor="middle" font-size="30" font-weight="700" fill="#0f172a">What you need</text>
  <text x="600" y="80" text-anchor="middle" font-size="16" fill="#475569">The numbers match the shopping list below. Roughly $120–160 if you buy everything new, less if you already have some of it.</text>

  <!-- card frames -->
  <g fill="#fff" stroke="#cbd5e1" stroke-width="2">
    <rect x="30" y="105" width="270" height="280" rx="16"/><rect x="320" y="105" width="270" height="280" rx="16"/>
    <rect x="610" y="105" width="270" height="280" rx="16"/><rect x="900" y="105" width="270" height="280" rx="16"/>
    <rect x="30" y="400" width="270" height="280" rx="16"/><rect x="320" y="400" width="270" height="280" rx="16"/>
    <rect x="610" y="400" width="270" height="280" rx="16"/><rect x="900" y="400" width="270" height="280" rx="16"/>
  </g>
  <g font-size="16" font-weight="700" fill="#fff">
    <circle cx="58" cy="133" r="16" fill="#0f172a"/><text x="58" y="139" text-anchor="middle">1</text>
    <circle cx="348" cy="133" r="16" fill="#0f172a"/><text x="348" y="139" text-anchor="middle">2</text>
    <circle cx="638" cy="133" r="16" fill="#0f172a"/><text x="638" y="139" text-anchor="middle">3</text>
    <circle cx="928" cy="133" r="16" fill="#0f172a"/><text x="928" y="139" text-anchor="middle">4</text>
    <circle cx="58" cy="428" r="16" fill="#0f172a"/><text x="58" y="434" text-anchor="middle">5</text>
    <circle cx="348" cy="428" r="16" fill="#0f172a"/><text x="348" y="434" text-anchor="middle">6</text>
    <circle cx="638" cy="428" r="16" fill="#0f172a"/><text x="638" y="434" text-anchor="middle">7</text>
    <circle cx="928" cy="428" r="16" fill="#0f172a"/><text x="928" y="434" text-anchor="middle">8</text>
  </g>

  <!-- 1 Raspberry Pi kit -->
  <g transform="translate(30,105)">
    <rect x="55" y="45" width="140" height="92" rx="8" fill="#15803d"/>
    <g fill="#facc15"><rect x="68" y="50" width="114" height="10" rx="1"/></g>
    <g fill="#a16207"><circle cx="72" cy="55" r="1.6"/><circle cx="82" cy="55" r="1.6"/><circle cx="92" cy="55" r="1.6"/><circle cx="102" cy="55" r="1.6"/><circle cx="112" cy="55" r="1.6"/><circle cx="122" cy="55" r="1.6"/><circle cx="132" cy="55" r="1.6"/><circle cx="142" cy="55" r="1.6"/><circle cx="152" cy="55" r="1.6"/><circle cx="162" cy="55" r="1.6"/><circle cx="172" cy="55" r="1.6"/></g>
    <rect x="100" y="80" width="34" height="34" rx="3" fill="#0f172a"/>
    <rect x="160" y="74" width="40" height="22" rx="2" fill="#cbd5e1"/><rect x="160" y="102" width="40" height="22" rx="2" fill="#cbd5e1"/>
    <rect x="200" y="150" width="34" height="24" rx="4" fill="#334155"/><path d="M200 162 q-30 0 -40 -20" stroke="#334155" stroke-width="5" fill="none"/>
    <rect x="30" y="148" width="22" height="28" rx="3" fill="#1d4ed8"/><path d="M30 148 h14 l8 7 v-7" fill="#1d4ed8"/>
    <text x="135" y="210" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Raspberry Pi 4 kit</text>
    <text x="135" y="232" text-anchor="middle" font-size="13.5" fill="#475569">mini computer + its power</text>
    <text x="135" y="250" text-anchor="middle" font-size="13.5" fill="#475569">supply + microSD card</text>
  </g>

  <!-- 2 servo -->
  <g transform="translate(320,105)">
    <rect x="80" y="62" width="110" height="56" rx="5" fill="#1e293b"/>
    <rect x="62" y="80" width="146" height="10" rx="3" fill="#1e293b"/>
    <circle cx="68" cy="85" r="3" fill="#f8fafc"/><circle cx="202" cy="85" r="3" fill="#f8fafc"/>
    <circle cx="160" cy="62" r="13" fill="#e2e8f0" stroke="#1e293b" stroke-width="2"/>
    <rect x="152" y="24" width="16" height="44" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
    <text x="118" y="100" text-anchor="middle" font-size="12" font-weight="700" fill="#e2e8f0">MG996R</text>
    <path d="M80 110 C 50 120, 50 150, 70 160" stroke="#f59e0b" stroke-width="4" fill="none"/>
    <path d="M80 104 C 44 118, 44 152, 76 164" stroke="#dc2626" stroke-width="4" fill="none"/>
    <path d="M80 98 C 38 116, 38 156, 82 168" stroke="#78350f" stroke-width="4" fill="none"/>
    <rect x="70" y="154" width="24" height="18" rx="2" fill="#0f172a"/>
    <text x="135" y="210" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">MG996R servo motor</text>
    <text x="135" y="232" text-anchor="middle" font-size="13.5" fill="#475569">the motor that swings</text>
    <text x="135" y="250" text-anchor="middle" font-size="13.5" fill="#475569">the flap (metal gears)</text>
  </g>

  <!-- 3 5V adapter -->
  <g transform="translate(610,105)">
    <rect x="58" y="50" width="70" height="90" rx="10" fill="#1e293b"/>
    <rect x="74" y="34" width="8" height="18" fill="#94a3b8"/><rect x="104" y="34" width="8" height="18" fill="#94a3b8"/>
    <text x="93" y="102" text-anchor="middle" font-size="15" font-weight="700" fill="#f8fafc">5V 3A</text>
    <path d="M128 110 C 170 110, 160 160, 200 150" stroke="#1e293b" stroke-width="5" fill="none"/>
    <rect x="196" y="142" width="24" height="16" rx="3" fill="#475569"/><rect x="218" y="146" width="8" height="8" fill="#94a3b8"/>
    <text x="135" y="210" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">5 V 3 A wall adapter</text>
    <text x="135" y="232" text-anchor="middle" font-size="13.5" fill="#475569">powers ONLY the motor,</text>
    <text x="135" y="250" text-anchor="middle" font-size="13.5" fill="#475569">round "barrel" plug</text>
  </g>

  <!-- 4 barrel to screw terminal -->
  <g transform="translate(900,105)">
    <rect x="70" y="70" width="70" height="40" rx="6" fill="#1e293b"/>
    <circle cx="104" cy="90" r="11" fill="#0f172a" stroke="#64748b" stroke-width="2"/><circle cx="104" cy="90" r="3" fill="#cbd5e1"/>
    <rect x="140" y="64" width="60" height="52" rx="4" fill="#16a34a"/>
    <circle cx="160" cy="78" r="7" fill="#cbd5e1"/><circle cx="160" cy="102" r="7" fill="#cbd5e1"/>
    <path d="M156 78 h8 M156 102 h8" stroke="#475569" stroke-width="2"/>
    <text x="185" y="83" font-size="16" font-weight="700" fill="#fff">+</text><text x="186" y="108" font-size="18" font-weight="700" fill="#fff">−</text>
    <text x="135" y="210" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Barrel-to-screw adapter</text>
    <text x="135" y="232" text-anchor="middle" font-size="13.5" fill="#475569">"female DC jack to screw</text>
    <text x="135" y="250" text-anchor="middle" font-size="13.5" fill="#475569">terminal", 5.5 × 2.1 mm</text>
  </g>

  <!-- 5 jumper wires -->
  <g transform="translate(30,400)">
    <g stroke-width="5" fill="none">
      <path d="M60 60 C 110 90, 150 40, 210 80" stroke="#f59e0b"/>
      <path d="M60 85 C 110 115, 150 65, 210 105" stroke="#dc2626"/>
      <path d="M60 110 C 110 140, 150 90, 210 130" stroke="#78350f"/>
      <path d="M60 135 C 110 165, 150 115, 210 155" stroke="#0f172a"/>
    </g>
    <g fill="#0f172a"><rect x="44" y="53" width="18" height="14" rx="2"/><rect x="44" y="78" width="18" height="14" rx="2"/><rect x="44" y="103" width="18" height="14" rx="2"/><rect x="44" y="128" width="18" height="14" rx="2"/></g>
    <g fill="#0f172a"><rect x="208" y="73" width="14" height="14" rx="2"/><rect x="208" y="98" width="14" height="14" rx="2"/><rect x="208" y="123" width="14" height="14" rx="2"/><rect x="208" y="148" width="14" height="14" rx="2"/></g>
    <g fill="#94a3b8"><rect x="222" y="78" width="10" height="4"/><rect x="222" y="103" width="10" height="4"/><rect x="222" y="128" width="10" height="4"/><rect x="222" y="153" width="10" height="4"/></g>
    <text x="135" y="210" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Jumper wires</text>
    <text x="135" y="232" text-anchor="middle" font-size="13.5" fill="#475569">a mixed pack with</text>
    <text x="135" y="250" text-anchor="middle" font-size="13.5" fill="#475569">"male-to-female" + "male-to-male"</text>
  </g>

  <!-- 6 hopper bottle -->
  <g transform="translate(320,400)">
    <path d="M100 30 h70 v70 q0 22 -20 34 v26 h-30 v-26 q-20 -12 -20 -34 z" fill="#e0f2fe" stroke="#0369a1" stroke-width="2.5"/>
    <rect x="118" y="160" width="34" height="10" rx="2" fill="#0369a1"/>
    <g fill="#92400e"><circle cx="120" cy="80" r="4"/><circle cx="132" cy="88" r="4"/><circle cx="146" cy="80" r="4"/><circle cx="156" cy="92" r="4"/><circle cx="126" cy="98" r="4"/><circle cx="140" cy="100" r="4"/><circle cx="150" cy="106" r="4"/><circle cx="134" cy="112" r="4"/></g>
    <path d="M100 30 h70" stroke="#0369a1" stroke-width="2.5" stroke-dasharray="5 4"/>
    <text x="135" y="210" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Food hopper</text>
    <text x="135" y="232" text-anchor="middle" font-size="13.5" fill="#475569">a 2-litre plastic bottle with</text>
    <text x="135" y="250" text-anchor="middle" font-size="13.5" fill="#475569">the bottom cut off works great</text>
  </g>

  <!-- 7 build supplies -->
  <g transform="translate(610,400)">
    <rect x="40" y="120" width="190" height="34" rx="3" fill="#d6a76c" stroke="#92400e" stroke-width="2"/>
    <path d="M60 128 h60 M140 140 h70" stroke="#b07a3c" stroke-width="2"/>
    <rect x="66" y="40" width="34" height="62" rx="6" fill="#dc2626"/><rect x="74" y="100" width="18" height="10" fill="#475569"/><path d="M83 110 v8" stroke="#475569" stroke-width="3"/>
    <rect x="58" y="60" width="12" height="30" rx="3" fill="#b91c1c"/>
    <path d="M130 50 c20 -10 40 -10 60 0 c4 20 -4 40 -30 46 c-26 -6 -34 -26 -30 -46 z" fill="none" stroke="#0f172a" stroke-width="4"/>
    <rect x="200" y="40" width="10" height="70" rx="5" fill="#fde68a" stroke="#a16207" stroke-width="1.5"/>
    <text x="135" y="210" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Building bits</text>
    <text x="135" y="232" text-anchor="middle" font-size="13.5" fill="#475569">wood board, hot glue gun,</text>
    <text x="135" y="250" text-anchor="middle" font-size="13.5" fill="#475569">zip ties, a craft stick</text>
  </g>

  <!-- 8 duck pellets -->
  <g transform="translate(900,400)">
    <path d="M80 40 h110 l10 130 h-130 z" fill="#86efac" stroke="#15803d" stroke-width="2.5"/>
    <path d="M80 40 l8 -10 h94 l8 10" fill="#4ade80" stroke="#15803d" stroke-width="2.5"/>
    <text x="135" y="100" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d">DUCK</text>
    <text x="135" y="120" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d">PELLETS</text>
    <g fill="#92400e"><circle cx="110" cy="146" r="4"/><circle cx="126" cy="152" r="4"/><circle cx="144" cy="146" r="4"/><circle cx="160" cy="152" r="4"/></g>
    <text x="135" y="210" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Waterfowl pellets</text>
    <text x="135" y="232" text-anchor="middle" font-size="13.5" fill="#475569">small, dry pellets.</text>
    <text x="135" y="250" text-anchor="middle" font-size="13.5" font-weight="700" fill="#b91c1c">Never bread!</text>
  </g>
</svg>
